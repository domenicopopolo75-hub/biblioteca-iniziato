name: TestFlight

# Solo avvio a mano. Repo pubblico: runner gratuiti. Chiave App Store Connect dedicata (segreti ASC_*).
on:
  workflow_dispatch:
    inputs:
      solo_prepara:
        description: "Solo registra l'identificativo e controlla la scheda app (nessuna build)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'it.biblioteca.iniziato' }}
  APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || '73SBXLA5M3' }}
  # Identificativi della chiave «GitHub Biblioteca» (non segreti; il segreto è solo ASC_KEY_P8)
  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || vars.ASC_KEY_ID || 'L7R3WR7D57' }}
  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || vars.ASC_ISSUER_ID || '5b13e1b7-b8dc-4fb9-9af4-bb2c72e9ef0e' }}
  ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}

jobs:
  prepara:
    name: Identificativo e scheda app (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Credenziali presenti
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do [ -n "${!v}" ] || { echo "Manca $v"; exit 1; }; done
          printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY' || { echo "ASC_KEY_P8 deve contenere tutto il file .p8"; exit 1; }
          echo "Credenziali presenti (valori non mostrati)."
      - run: node scripts/ios-firma.mjs prepara --bundle "$BUNDLE_ID"

  compila:
    name: Firma e invio a TestFlight (macOS)
    needs: prepara
    if: ${{ !inputs.solo_prepara }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Xcode (il più recente)
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)"
          xcodebuild -version
      - name: Genera progetto
        run: brew install xcodegen && cd ios && xcodegen generate
      - name: Numero di build
        run: |
          n=$(node scripts/ios-firma.mjs prossima-build --bundle "$BUNDLE_ID")
          [[ "$n" =~ ^[1-9][0-9]{0,3}$ ]] || { echo "Numero build non valido"; exit 1; }
          echo "BUILD_NUMBER=$n" >> "$GITHUB_ENV"
      - name: Firma di distribuzione, archivio e invio
        run: |
          set -o pipefail
          mkdir -p build
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"; chmod 600 "$KEY_PATH"
          AUTH=(-authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          node scripts/ios-firma.mjs crea --dir build/firma --bundle "$BUNDLE_ID" --run "${{ github.run_id }}-${{ github.run_attempt }}"
          PROFILE_NAME=$(node -e "console.log(JSON.parse(require('fs').readFileSync('build/firma/stato.json','utf8')).profileName)")
          PROFILE_UUID=$(node -e "console.log(JSON.parse(require('fs').readFileSync('build/firma/stato.json','utf8')).profileUuid)")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp build/firma/profilo.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/biblioteca-firma.keychain-db"; KCPW="$(uuidgen)"
          echo "KEYCHAIN_FIRMA=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KCPW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KCPW" "$KEYCHAIN"
          for ca in AppleWWDRCAG3 AppleWWDRCAG6; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer" \
              && security import "$RUNNER_TEMP/$ca.cer" -k "$KEYCHAIN" -T /usr/bin/codesign >/dev/null 2>&1 || true
          done
          security import build/firma/certificato.p12 -k "$KEYCHAIN" -P biblioteca-ci -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          xcodebuild archive -project ios/Biblioteca.xcodeproj -scheme Biblioteca -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Biblioteca.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" 2>&1 | tee build/archivio.log | grep -E "error:|ARCHIVE" || true
          grep -q "ARCHIVE SUCCEEDED" build/archivio.log

          app=build/Biblioteca.xcarchive/Products/Applications/Biblioteca.app
          [ "$(plutil -extract CFBundleVersion raw -o - "$app/Info.plist")" = "$BUILD_NUMBER" ]
          plutil -extract UIBackgroundModes xml1 -o - "$app/Info.plist" | grep -q audio || { echo "Manca la modalità audio in background"; exit 1; }

          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Biblioteca.xcarchive -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist "${AUTH[@]}" 2>&1 | tee build/esporta.log | tail -20
          grep -q "EXPORT SUCCEEDED" build/esporta.log
          echo "### Build $BUILD_NUMBER inviata a TestFlight ($BUNDLE_ID)" >> "$GITHUB_STEP_SUMMARY"
      - name: Pulizia chiavi dal computer
        if: always()
        run: |
          [ -n "${KEYCHAIN_FIRMA:-}" ] && security delete-keychain "$KEYCHAIN_FIRMA" || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 build/firma/chiave.pem build/firma/certificato.p12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-testflight
          path: |
            build/archivio.log
            build/esporta.log
          retention-days: 14

  attendi:
    name: Elaborazione Apple (Linux)
    needs: compila
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          n=$(node scripts/ios-firma.mjs prossima-build --bundle "$BUNDLE_ID"); n=$((n-1))
          node scripts/ios-firma.mjs attendi --bundle "$BUNDLE_ID" --build "$n" --minuti 40
